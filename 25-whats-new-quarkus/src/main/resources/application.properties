# ---------------------------------------------------------------------------
# Base de datos (H2 en memoria) para el catalogo de cursos + cache L2 (3.38)
# ---------------------------------------------------------------------------
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:whatsnew;DB_CLOSE_DELAY=-1
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.log.sql=true

# La cache L2 esta habilitada por defecto; se declara explicitamente para que
# quede claro en la demo.
quarkus.hibernate-orm.second-level-caching-enabled=true

# Novedad de Quarkus 3.38: eviccion por peso (en lugar de por conteo de objetos)
# para la region "cursos". Se limita la cache a 5000 "unidades de peso" segun
# el CursoWeigher, en vez de un numero fijo de entidades.
quarkus.hibernate-orm.cache."cursos".memory.maximum-weight=5000
quarkus.hibernate-orm.cache."cursos".memory.weigher-class=edu.utp.quarkus.whatsnew.cache.CursoWeigher
quarkus.hibernate-orm.cache."cursos".expiration.max-idle=5m

# ---------------------------------------------------------------------------
# Quarkus LangChain4j 1.13.3 sobre AWS Bedrock (mismo modelo que el modulo 24)
# ---------------------------------------------------------------------------
quarkus.langchain4j.bedrock.chat-model.model-id=anthropic.claude-3-haiku-20240307-v1:0
quarkus.langchain4j.bedrock.chat-model.aws.region=us-east-1

# En test/dev sin credenciales de AWS configuradas, se puede desactivar la
# integracion real con Bedrock para no romper el resto de la demo.
%test.quarkus.langchain4j.bedrock.enable-integration=false
